########################################################################
## Grasses mod additional drops config
## Drop Type 'ALL' - each item has a declared chance of being dropped (can drop all at once)
## Drop Type 'ONE OF' - each item has a declared chance of being dropped (can drop randomly only one of them)
## 'chances' - chance set name or values 
## 'conditions' - (optional) BlockState or mobs properties terms
## Detailed information about the system on the wiki on gitHub:'
## https://github.com/DanteTooMayCry/Grasses/wiki/Additional-Drop-System'
########################################################################
header_marker = ""

